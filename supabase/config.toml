# Supabase local development configuration.
# Docs: https://supabase.com/docs/guides/local-development

project_id = "moments"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.analytics]
enabled = true
max_namespaces = 10

[storage.image_transformation]
enabled = true

[auth]
enabled = true
site_url = "moments://"
additional_redirect_urls = ["moments://", "exp://10.100.255.90:8081"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[analytics]
enabled = false
